<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Courses</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-student">Student</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<main class="main-content"><div class="card"><div class="card-header">My Courses</div><div class="table-responsive"><table><tr><th>Course Code</th><th>Course Name</th><th>Semester</th><th>Projects</th><th>Tasks</th></tr><tbody id="courseTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("student");const s=Session.get();$("#userName").textContent=s.name;const css=DB.get("course_students").filter(c=>c.studentId===s.id);const courses=DB.get("courses");const ps=DB.get("projects");const ts=DB.get("tasks");const tbody=$("#courseTable");if(css.length){tbody.innerHTML=css.map(c=>{const course=courses.find(x=>x.id===c.courseId);return"<tr><td><strong>"+escapeHtml(course?.code||"-")+"</strong></td><td>"+escapeHtml(course?.name||"-")+"</td><td>"+escapeHtml(course?.semester||"-")+"</td><td>"+ps.filter(x=>x.courseId===c.courseId).length+"</td><td>"+ts.filter(x=>x.courseId===c.courseId).length+"</td></tr>"}).join("")}else{$tbody.html("<tr><td colspan=\"5\"><div class=\"empty-state\"><i class=\"fas fa-book\"></i><p>No courses enrolled</p></div></td></tr>")}}</script></body></html>
