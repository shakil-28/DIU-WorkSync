<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contribution Report</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-student">Student</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<aside class="sidebar" id="sidebar"><nav class="sidebar-nav"><div class="nav-section">Main</div><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a><a href="my-courses.html" class="nav-link"><i class="fas fa-book"></i> My Courses</a><a href="my-tasks.html" class="nav-link"><i class="fas fa-tasks"></i> My Tasks</a><a href="my-projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> My Projects</a><div class="nav-section">More</div><a href="my-submissions.html" class="nav-link"><i class="fas fa-file-upload"></i> Submissions</a><a href="contribution-report.html" class="nav-link active"><i class="fas fa-chart-pie"></i> My Contribution</a><a href="activity.html" class="nav-link"><i class="fas fa-history"></i> Activity</a><a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Profile</a><div class="nav-divider"></div><a href="#" class="nav-link logout" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></nav></aside>
<main class="main-content"><div class="card"><div class="card-header">My Contribution Report <button class="btn btn-sm btn-success" onclick="exportCSV()" style="margin-left:auto"><i class="fas fa-file-csv"></i> Export CSV</button></div><p style="color:var(--muted);margin-bottom:15px">Contribution = Weight% x (Teacher Score / 10)</p><div class="table-responsive"><table><tr><th>Student</th><th>Weight %</th><th>Teacher Score</th><th>Contribution %</th><th>Status</th></tr><tbody id="reportTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("student");const s=Session.get();$("#userName").textContent=s.name;const pm=DB.get("project_members").filter(p=>p.studentId===s.id);const tbody=$("#reportTable");if(pm.length){const m=pm[0];const tas=DB.get("task_assignments").filter(t=>t.projectId===m.projectId);const members=DB.get("users").filter(u=>tas.some(t=>t.studentId===u.id));tbody.innerHTML=members.map(u=>{const utas=tas.filter(t=>t.studentId===u.id);const totalWeight=utas.reduce((a,t)=>a+t.weightPercent,0);const reviews=DB.get("task_reviews");const approved=utas.filter(t=>reviews.some(r=>r.submissionId&&r.status==="Approved"));const avgScore=approved.length?approved.reduce((a,t)=>a+(reviews.find(r=>r.submissionId===t.id)?.score||0),0)/approved.length:0;const contribution=totalWeight*(avgScore/10);return"<tr style=\""+(u.id===s.id?"background:#e8f5e9;":"")+"\"><td><strong>"+escapeHtml(u.name)+"</strong>"+(u.id===s.id?" <small>(You)</small>":"")+"</td><td>"+totalWeight+"%</td><td>"+avgScore.toFixed(1)+"/10</td><td><strong style=\"font-size:1.2rem\">"+contribution.toFixed(1)+"%</strong></td><td><span class=\"badge "+getStatusClass(approved.length?"Approved":"Pending")+"\">"+(approved.length?"Approved":"Pending")+"</span></td></tr>"}).join("")}else{$tbody.html("<tr><td colspan=\"5\"><div class=\"empty-state\"><i class=\"fas fa-chart-pie\"></i><p>No project found</p></div></td></tr>")}}function exportCSV(){const pm=DB.get("project_members").filter(p=>p.studentId===Session.get().id);if(!pm.length){showNotif("No project data","warning");return}const m=pm[0];const tas=DB.get("task_assignments").filter(t=>t.projectId===m.projectId);const members=DB.get("users").filter(u=>tas.some(t=>t.studentId===u.id));const reviews=DB.get("task_reviews");const headers=["Student","Weight %","Avg Score","Contribution %","Status"];const rows=members.map(u=>{const utas=tas.filter(t=>t.studentId===u.id);const totalWeight=utas.reduce((a,t)=>a+t.weightPercent,0);const approved=utas.filter(t=>reviews.some(r=>r.submissionId&&r.status==="Approved"));const avgScore=approved.length?approved.reduce((a,t)=>a+(reviews.find(r=>r.submissionId===t.id)?.score||0),0)/approved.length:0;return[u.name,totalWeight+"%",avgScore.toFixed(1),((totalWeight*(avgScore/10))).toFixed(1)+"%",approved.length?"Approved":"Pending"]});exportCSV("contribution_report.csv",headers,rows)}</script></body></html>
