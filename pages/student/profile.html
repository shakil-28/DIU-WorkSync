<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-student">Student</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<main class="main-content"><div class="card" style="max-width:500px"><div class="card-header">My Profile</div><form onsubmit="saveProfile(event)"><div class="form-group"><label>Full Name</label><input type="text" class="form-control" id="profName" required></div><div class="form-group"><label>Email</label><input type="email" class="form-control" id="profEmail" disabled></div><div class="form-group"><label>Phone</label><input type="text" class="form-control" id="profPhone" placeholder="Optional"></div><div class="form-group"><label>GitHub Username</label><input type="text" class="form-control" id="profGithub" placeholder="e.g. johndoe"></div><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button></form></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("student");const s=Session.get();$("#userName").textContent=s.name;const user=DB.get("users").find(u=>u.id===s.id);if(user){$("#profName").value=user.name;$("#profEmail").value=user.email;$("#profPhone").value=user.phone||"";$("#profGithub").value=user.github||""}function saveProfile(e){e.preventDefault();user.name=$("#profName").value.trim();user.phone=$("#profPhone").value.trim();user.github=$("#profGithub").value.trim();DB.update("users",user.id,user);Session.login(user.email,user.password);showNotif("Profile updated!","success")}</script></body></html>
