<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Projects</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-student">Student</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<aside class="sidebar" id="sidebar"><nav class="sidebar-nav"><div class="nav-section">Main</div><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a><a href="my-courses.html" class="nav-link"><i class="fas fa-book"></i> My Courses</a><a href="my-tasks.html" class="nav-link"><i class="fas fa-tasks"></i> My Tasks</a><a href="my-projects.html" class="nav-link active"><i class="fas fa-project-diagram"></i> My Projects</a><div class="nav-section">More</div><a href="my-submissions.html" class="nav-link"><i class="fas fa-file-upload"></i> Submissions</a><a href="contribution-report.html" class="nav-link"><i class="fas fa-chart-pie"></i> My Contribution</a><a href="activity.html" class="nav-link"><i class="fas fa-history"></i> Activity</a><a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Profile</a><div class="nav-divider"></div><a href="#" class="nav-link logout" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></nav></aside>
<main class="main-content"><div class="card"><div class="card-header">My Projects</div><div class="table-responsive"><table><tr><th>Project</th><th>Course</th><th>Progress</th><th>Status</th><th>Actions</th></tr><tbody id="projectTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("student");const s=Session.get();$("#userName").textContent=s.name;const pm=DB.get("project_members").filter(p=>p.studentId===s.id);const projects=DB.get("projects");const tas=DB.get("task_assignments");const tbody=$("#projectTable");if(pm.length){tbody.innerHTML=pm.map(m=>{const pr=projects.find(x=>x.id===m.projectId);const total=tas.filter(t=>t.projectId===m.projectId).length;const done=tas.filter(t=>t.projectId===m.projectId&&t.status==="Completed").length;const pct=total?Math.round(done/total*100):0;return"<tr><td><strong>"+escapeHtml(pr?.title||"-")+"</strong></td><td>"+escapeHtml(DB.get("courses").find(x=>x.id===pr?.courseId)?.code||"-")+"</td><td><div class=\"progress-bar\" style=\"width:120px\"><div class=\"progress-fill "+(pct>=75?"green":pct>=50?"":"orange")+"\" style=\"width:"+pct+"%\"></div></div><small>"+done+"/"+total+" tasks</small></td><td><span class=\"badge "+getStatusClass(pr?.status)+"\">"+(pr?.status||"-")+"</span></td><td><button class=\"btn btn-sm btn-outline\" onclick=\"window.location.href='contribution-report.html?project="+m.projectId+"'\">View Report</button></td></tr>"}).join("")}else{$tbody.html("<tr><td colspan=\"5\"><div class=\"empty-state\"><i class=\"fas fa-project-diagram\"></i><p>No projects assigned</p></div></td></tr>")}</script></body></html>
