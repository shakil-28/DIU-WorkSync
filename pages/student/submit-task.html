<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Submit Task</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-student">Student</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<aside class="sidebar" id="sidebar"><nav class="sidebar-nav"><div class="nav-section">Main</div><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a><a href="my-courses.html" class="nav-link"><i class="fas fa-book"></i> My Courses</a><a href="my-tasks.html" class="nav-link"><i class="fas fa-tasks"></i> My Tasks</a><a href="my-projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> My Projects</a><div class="nav-section">More</div><a href="my-submissions.html" class="nav-link"><i class="fas fa-file-upload"></i> Submissions</a><a href="contribution-report.html" class="nav-link"><i class="fas fa-chart-pie"></i> My Contribution</a><a href="activity.html" class="nav-link"><i class="fas fa-history"></i> Activity</a><a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Profile</a><div class="nav-divider"></div><a href="#" class="nav-link logout" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></nav></aside>
<main class="main-content"><div class="card"><div class="card-header">Submit Task</div><div id="taskInfo"></div><form onsubmit="handleSubmit(event)"><div class="form-group"><label>Upload File (PDF, Image, DOC)</label><input type="file" class="form-control" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.txt"></div><div class="form-group"><label>Link (GitHub, Figma, Drive, Demo)</label><input type="url" class="form-control" id="linkInput" placeholder="https://github.com/your-repo"></div><div class="form-group"><label>Work Description</label><textarea class="form-control" id="descInput" rows="4" placeholder="Describe what you did..."></textarea></div><button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Submit</button><a href="my-tasks.html" class="btn btn-outline">Cancel</a></form></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("student");const s=Session.get();$("#userName").textContent=s.name;const params=new URLSearchParams(window.location.search);const taId=parseInt(params.get("id"));const ta=DB.get("task_assignments").find(t=>t.id===taId&&t.studentId===s.id);if(!ta){alert("Task not found");window.location.href="my-tasks.html";exit}const tk=DB.get("tasks").find(x=>x.id===ta.taskId);$("#taskInfo").innerHTML="<p><strong>Task:</strong> "+escapeHtml(tk?.title)+"</p><p><strong>Project:</strong> "+escapeHtml(DB.get("projects").find(x=>x.id===ta.projectId)?.title)+"</p><p><strong>Weight:</strong> <strong>"+ta.weightPercent+"%</strong></p><hr style=\"margin:15px 0\">";function handleSubmit(e){e.preventDefault();const desc=$("#descInput").value.trim();const link=$("#linkInput").value.trim();DB.add("submissions",{taskIdAssignmentId:ta.id,studentId:s.id,description:desc,linkUrl:link,status:"Submitted",submittedAt:new Date().toISOString()});DB.update("task_assignments",ta.id,{status:"Completed"});DB.add("activities",{userId:s.id,action:"Submitted task: "+tk?.title,entityType:"submission",entityId:DB.get("submissions").length,loggedAt:new Date().toISOString()});showNotif("Task submitted successfully!","success");setTimeout(()=>window.location.href="my-tasks.html",1000)}</script></body></html>
