<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Submissions</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-student">Student</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<main class="main-content"><div class="card"><div class="card-header">My Submissions</div><div class="table-responsive"><table><tr><th>Task</th><th>Project</th><th>Submitted</th><th>Description</th><th>Review</th><th>Score</th></tr><tbody id="subTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("student");const s=Session.get();$("#userName").textContent=s.name;const subs=DB.get("submissions").filter(sub=>sub.studentId===s.id);const tbody=$("#subTable");if(subs.length){tbody.innerHTML=subs.map(sub=>{const tk=DB.get("tasks").find(t=>t.id===sub.taskId);const pr=DB.get("projects").find(p=>p.id===tk?.projectId);const rev=DB.get("task_reviews").find(r=>r.submissionId===sub.id);return"<tr><td><strong>"+escapeHtml(tk?.title||"-")+"</strong></td><td>"+escapeHtml(pr?.title||"-")+"</td><td>"+formatDate(sub.submittedAt)+"</td><td><small>"+escapeHtml((sub.description||"").substring(0,50))+"</small></td><td><span class=\"badge "+getStatusClass(rev?.status)+"\">"+(rev?.status||"Pending")+"</span></td><td>"+(rev?.score||"-")+"/10</td></tr>"}).join("")}else{$tbody.html("<tr><td colspan=\"6\"><div class=\"empty-state\"><i class=\"fas fa-file-upload\"></i><p>No submissions yet</p></div></td></tr>")}}</script></body></html>
