<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Activity History</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-student">Student</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<aside class="sidebar" id="sidebar"><nav class="sidebar-nav"><div class="nav-section">Main</div><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a><a href="my-courses.html" class="nav-link"><i class="fas fa-book"></i> My Courses</a><a href="my-tasks.html" class="nav-link"><i class="fas fa-tasks"></i> My Tasks</a><a href="my-projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> My Projects</a><div class="nav-section">More</div><a href="my-submissions.html" class="nav-link"><i class="fas fa-file-upload"></i> Submissions</a><a href="contribution-report.html" class="nav-link"><i class="fas fa-chart-pie"></i> My Contribution</a><a href="activity.html" class="nav-link active"><i class="fas fa-history"></i> Activity</a><a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Profile</a><div class="nav-divider"></div><a href="#" class="nav-link logout" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></nav></aside>
<main class="main-content"><div class="card"><div class="card-header">My Activity History</div><div class="table-responsive"><table><tr><th>Date & Time</th><th>Action</th></tr><tbody id="actTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("student");const s=Session.get();$("#userName").textContent=s.name;const acts=DB.get("activities").filter(a=>a.userId===s.id).reverse();const tbody=$("#actTable");if(acts.length){tbody.innerHTML=acts.map(a=>"<tr><td>"+formatDateTime(a.loggedAt)+"</td><td>"+escapeHtml(a.action)+"</td></tr>").join("")}else{$tbody.html("<tr><td colspan=\"2\"><div class=\"empty-state\"><i class=\"fas fa-history\"></i><p>No activity yet</p></div></td></tr>")}}</script></body></html>
