<main class="main-content"><div class="card"><div class="card-header">Create New Course</div><form onsubmit="createCourse(event)"><div style="display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:15px"><div class="form-group"><label>Course Code</label><input type="text" class="form-control" id="courseCode" required placeholder="CSE-307"></div><div class="form-group"><label>Course Name</label><input type="text" class="form-control" id="courseName" required placeholder="Web Engineering"></div><div class="form-group"><label>Semester</label><input type="text" class="form-control" id="courseSem" required placeholder="Spring 2026"></div><div class="form-group" style="display:flex;align-items:flex-end"><button type="submit" class="btn btn-primary btn-block">Create</button></div></div></form></div><div class="card"><div class="card-header">My Courses</div><div class="table-responsive"><table><tr><th>Code</th><th>Name</th><th>Semester</th><th>Students</th><th>Projects</th></tr><tbody id="courseTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("teacher");const s=Session.get();$("#userName").textContent=s.name;function createCourse(e){e.preventDefault();const code=$("#courseCode").value.trim();const name=$("#courseName").value.trim();const sem=$("#courseSem").value.trim();DB.add("courses",{code,name,semester:sem,teacherId:s.id});DB.add("activities",{userId:s.id,action:"Created course: "+name,entityType:"course",entityId:DB.get("courses").length,loggedAt:new Date().toISOString()});showNotif("Course created!","success");$("#courseCode").value="";$("#courseName").value="";$("#courseSem").value=""}const courses=DB.get("courses").filter(c=>c.teacherId===s.id);const css=DB.get("course_students");const ps=DB.get("projects");const tbody=$("#courseTable");if(courses.length){tbody.innerHTML=courses.map(c=>"<tr><td><strong>"+escapeHtml(c.code)+"</strong></td><td>"+escapeHtml(c.name)+"</td><td>"+escapeHtml(c.semester)+"</td><td>"+css.filter(x=>x.courseId===c.id).length+"</td><td>"+ps.filter(x=>x.courseId===c.id).length+"</td></tr>").join("")}else{$tbody.html("<tr><td colspan=\"5\"><div class=\"empty-state\"><i class=\"fas fa-book\"></i><p>No courses yet</p></div></td></tr>")}}</script></body></html>
