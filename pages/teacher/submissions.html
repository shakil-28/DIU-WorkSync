<main class="main-content"><div class="card"><div class="card-header">Submissions Review</div><div class="table-responsive"><table><tr><th>Student</th><th>Task</th><th>Submitted</th><th>Description</th><th>Review</th><th>Actions</th></tr><tbody id="subTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><div class="modal-overlay" id="reviewModal"><div class="modal"><h3>Review Submission</h3><div id="reviewInfo"></div><form onsubmit="submitReview(event)"><input type="hidden" id="reviewSubId"><div class="form-group"><label>Score (0-10)</label><input type="number" class="form-control" id="reviewScore" min="0" max="10" value="5"></div><div class="form-group"><label>Status</label><select class="form-control" id="reviewStatus"><option>Approved</option><option>Revision Requested</option><option>Rejected</option></select></div><div class="form-group"><label>Feedback</label><textarea class="form-control" id="reviewFeedback" rows="3"></textarea></div><div class="modal-actions"><button type="submit" class="btn btn-primary">Submit Review</button><button type="button" class="btn btn-outline" onclick="hideModal(\"reviewModal\")">Close</button></div></form></div></div><script src="../js/app.js"></script><script>requireAuth();requireRole("teacher");const s=Session.get();$("#userName").textContent=s.name;const subs=DB.get("submissions");const tbody=$("#subTable");if(subs.length){tbody.innerHTML=subs.map(sub=>{const tk=DB.get("tasks").find(t=>t.id===sub.taskId);const usr=DB.get("users").find(u=>u.id===sub.studentId);const rev=DB.get("task_reviews").find(r=>r.submissionId===sub.id);return"<tr><td><strong>"+escapeHtml(usr?.name||"-")+"</strong></td><td>"+escapeHtml(tk?.title||"-")+"</td><td>"+formatDate(sub.submittedAt)+"</td><td><small>"+escapeHtml((sub.description||"").substring(0,60))+"</small></td><td><span class=\"badge "+getStatusClass(rev?.status)+"\">"+(rev?.status||"Pending")+"</span></td><td><button class=\"btn btn-sm btn-primary\" onclick=\"openReview("+sub.id+",\""+escapeHtml(usr?.name||"")+"\",\""+escapeHtml(tk?.title||"")+"\")\">Review</button></td></tr>"}).join("")}else{$tbody.html("<tr><td colspan=\"6\"><div class=\"empty-state\"><i class=\"fas fa-file-upload\"></i><p>No submissions yet</p></div></td></tr>")}}function openReview(id,name,title){$("#reviewSubId").value=id;$("#reviewInfo").innerHTML="<p><strong>Student:</strong> "+name+"</p><p><strong>Task:</strong> "+title+"</p>";showModal("reviewModal")}function submitReview(e){e.preventDefault();const id=parseInt($("#reviewSubId").value);const score=parseInt($("#reviewScore").value);const status=$("#reviewStatus").value;const feedback=$("#reviewFeedback").value.trim();DB.add("task_reviews",{submissionId:id,teacherId:s.id,score,status,feedback,reviewedAt:new Date().toISOString()});DB.update("task_assignments",DB.get("submissions").find(s=>s.id===id)?.taskIdAssignmentId,{status:status==="Approved"?"Completed":"In Progress"});DB.add("activities",{userId:s.id,action:"Reviewed submission #"+id+" - "+status,entityType:"review",entityId:id,loggedAt:new Date().toISOString()});showNotif("Review submitted!","success");hideModal("reviewModal");window.location.reload()}</script></body></html>
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Submissions</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-teacher">Teacher</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
