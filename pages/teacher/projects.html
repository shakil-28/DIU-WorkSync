<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Projects</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-teacher">Teacher</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<aside class="sidebar" id="sidebar"><nav class="sidebar-nav"><div class="nav-section">Main</div><a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a><a href="courses.html" class="nav-link"><i class="fas fa-book"></i> Courses</a><a href="projects.html" class="nav-link active"><i class="fas fa-project-diagram"></i> Projects</a><a href="tasks.html" class="nav-link"><i class="fas fa-tasks"></i> Tasks</a><div class="nav-section">Management</div><a href="submissions.html" class="nav-link"><i class="fas fa-file-upload"></i> Submissions</a><a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i> Reports</a><a href="announcements.html" class="nav-link"><i class="fas fa-bullhorn"></i> Announcements</a><div class="nav-divider"></div><a href="#" class="nav-link logout" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></nav></aside>
<main class="main-content"><div class="card"><div class="card-header">Create Project</div><form onsubmit="createProject(event)"><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px"><div class="form-group"><label>Course</label><select class="form-control" id="projCourse" required></select></div><div class="form-group"><label>Group Name</label><input type="text" class="form-control" id="projGroup" placeholder="Group 03" required></div><div class="form-group" style="grid-column:1/-1"><label>Project Title</label><input type="text" class="form-control" id="projTitle" required></div><div class="form-group" style="grid-column:1/-1"><label>Description</label><textarea class="form-control" id="projDesc" rows="3"></textarea></div></div><button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Project</button></form></div><div class="card"><div class="card-header">My Projects</div><div class="table-responsive"><table><tr><th>Project</th><th>Course</th><th>Group</th><th>Status</th><th>Created</th></tr><tbody id="projTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("teacher");const s=Session.get();$("#userName").textContent=s.name;const courses=DB.get("courses").filter(c=>c.teacherId===s.id);$("#projCourse").innerHTML=courses.map(c=>"<option value=\""+c.id+"\">"+escapeHtml(c.code)+" - "+escapeHtml(c.name)+"</option>").join("");function createProject(e){e.preventDefault();const courseId=parseInt($("#projCourse").value);const title=$("#projTitle").value.trim();const desc=$("#projDesc").value.trim();const group=$("#projGroup").value.trim();DB.add("projects",{title,description:desc,courseId,teacherId:s.id,status:"Active"});DB.add("activities",{userId:s.id,action:"Created project: "+title,entityType:"project",entityId:DB.get("projects").length,loggedAt:new Date().toISOString()});showNotif("Project created! Now assign members.","success");$("#projTitle").value="";$("#projDesc").value="";$("#projGroup").value="";loadProjects()}function loadProjects(){const projects=DB.get("projects").filter(p=>p.teacherId===s.id);const tbody=$("#projTable");if(projects.length){tbody.innerHTML=projects.map(p=>"<tr><td><strong>"+escapeHtml(p.title)+"</strong></td><td>"+escapeHtml(DB.get("courses").find(c=>c.id===p.courseId)?.code||"-")+"</td><td>"+DB.get("project_members").filter(m=>m.projectId===p.id).length+" members</td><td><span class=\"badge "+getStatusClass(p.status)+"\">"+p.status+"</span></td><td>"+formatDate(p.created_at)+"</td></tr>").join("")}else{$tbody.html("<tr><td colspan=\"5\"><div class=\"empty-state\"><i class=\"fas fa-project-diagram\"></i><p>No projects yet</p></div></td></tr>")}}loadProjects()</script></body></html>
