<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reports</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-teacher">Teacher</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<main class="main-content"><div class="card"><div class="card-header">Project Contribution Reports</div><div class="table-responsive"><table><tr><th>Project</th><th>Course</th><th>Status</th><th>Action</th></tr><tbody id="projTable"></tbody></table></div></div><div id="reportSection" style="display:none"><div class="card"><div class="card-header">Contribution Report <button class="btn btn-sm btn-success" onclick="exportReport()"><i class="fas fa-file-csv"></i> Export CSV</button></div><div class="table-responsive"><table><tr><th>Student</th><th>Weight %</th><th>Teacher Score</th><th>Contribution %</th></tr><tbody id="reportTable"></tbody></table></div></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("teacher");const s=Session.get();$("#userName").textContent=s.name;const projects=DB.get("projects").filter(p=>p.teacherId===s.id);const tbody=$("#projTable");if(projects.length){tbody.innerHTML=projects.map(p=>"<tr><td><strong>"+escapeHtml(p.title)+"</strong></td><td>"+escapeHtml(DB.get("courses").find(c=>c.id===p.courseId)?.code||"-")+"</td><td><span class=\"badge "+getStatusClass(p.status)+"\">"+p.status+"</span></td><td><button class=\"btn btn-sm btn-primary\" onclick=\"showReport("+p.id+")\">View Report</button></td></tr>").join("")}else{$tbody.html("<tr><td colspan=\"4\"><div class=\"empty-state\"><i class=\"fas fa-chart-bar\"></i><p>No projects yet</p></div></td></tr>")}}function showReport(pid){const pm=DB.get("project_members").filter(p=>p.projectId===pid);const tas=DB.get("task_assignments").filter(t=>t.projectId===pid);const reviews=DB.get("task_reviews");const tbody=$("#reportTable");if(pm.length){tbody.innerHTML=pm.map(m=>{const utas=tas.filter(t=>t.studentId===m.studentId);const user=DB.get("users").find(u=>u.id===m.studentId);const totalWeight=utas.reduce((a,t)=>a+t.weightPercent,0);const approved=utas.filter(t=>reviews.some(r=>r.submissionId===tas.find(ta=>ta.id===t.id)?.id&&r.status==="Approved"));const avgScore=approved.length?approved.reduce((a,t)=>a+(reviews.find(r=>r.submissionId===tas.find(ta=>ta.id===t.id)?.id)?.score||0),0)/approved.length:0;const contrib=totalWeight*(avgScore/10);return"<tr><td><strong>"+escapeHtml(user?.name||"-")+"</strong></td><td>"+totalWeight+"%</td><td>"+avgScore.toFixed(1)+"/10</td><td><strong style=\"font-size:1.2rem;color:"+((contrib>=25)?"var(--secondary)":"var(--warning)")+"\">"+contrib.toFixed(1)+"%</strong></td></tr>"}).join("")}$("#reportSection").style.display="block";$("#reportSection").scrollIntoView({behavior:"smooth"})}function exportReport(){const pid=parseInt(new URLSearchParams(window.location.search).get("project"));if(!pid)return;const pm=DB.get("project_members").filter(p=>p.projectId===pid);const tas=DB.get("task_assignments").filter(t=>t.projectId===pid);const reviews=DB.get("task_reviews");const headers=["Student","Weight %","Avg Score","Contribution %"];const rows=pm.map(m=>{const utas=tas.filter(t=>t.studentId===m.studentId);const user=DB.get("users").find(u=>u.id===m.studentId);const totalWeight=utas.reduce((a,t)=>a+t.weightPercent,0);const avgScore=utas.reduce((a,t)=>a+(reviews.find(r=>r.submissionId===t.id)?.score||0),0)/utas.length||0;return[user?.name,totalWeight+"%",avgScore.toFixed(1),(totalWeight*(avgScore/10)).toFixed(1)+"%"]});exportCSV("contribution_report_"+pid+".csv",headers,rows)}</script></body></html>
