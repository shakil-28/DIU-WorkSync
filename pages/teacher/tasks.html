<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Teacher Tasks</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body><div class="app-layout"><header class="topbar"><div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../index.html" class="logo">DIU WorkSync</a></div><div class="topbar-right"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button><div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span class="role-badge role-teacher">Teacher</span></div><button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button></div></header>
<main class="main-content"><div class="card"><div class="card-header">Create Task</div><form onsubmit="createTask(event)"><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px"><div class="form-group"><label>Course</label><select class="form-control" id="taskCourse" required></select></div><div class="form-group"><label>Task Type</label><select class="form-control" id="taskType"><option>Group Project</option><option>Assignment</option><option>Presentation</option><option>Lab Work</option><option>Lab Report</option><option>Research Work</option><option>Exam Preparation</option></select></div><div class="form-group" style="grid-column:1/-1"><label>Title</label><input type="text" class="form-control" id="taskTitle" required></div><div class="form-group" style="grid-column:1/-1"><label>Description</label><textarea class="form-control" id="taskDesc" rows="3"></textarea></div><div class="form-group"><label>Priority</label><select class="form-control" id="taskPriority"><option>High</option><option>Medium</option><option>Low</option></select></div><div class="form-group"><label>Deadline</label><input type="date" class="form-control" id="taskDeadline"></div></div><button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Task</button></form></div><div class="card"><div class="card-header">All Tasks</div><div class="table-responsive"><table><tr><th>Title</th><th>Type</th><th>Course</th><th>Priority</th><th>Deadline</th><th>Status</th></tr><tbody id="taskTable"></tbody></table></div></div></main><footer class="main-footer">&copy; 2026 DIU WorkSync</footer></div><script src="../js/app.js"></script><script>requireAuth();requireRole("teacher");const s=Session.get();$("#userName").textContent=s.name;const courses=DB.get("courses").filter(c=>c.teacherId===s.id);$("#taskCourse").innerHTML=courses.map(c=>"<option value=\""+c.id+"\">"+escapeHtml(c.code)+" - "+escapeHtml(c.name)+"</option>").join("");function createTask(e){e.preventDefault();const course_id=parseInt($("#taskCourse").value);const title=$("#taskTitle").value.trim();const desc=$("#taskDesc").value.trim();const type=$("#taskType").value;const priority=$("#taskPriority").value;const deadline=$("#taskDeadline").value;DB.add("tasks",{title,description:desc,type,course_id,teacher_id:s.id,priority,status:"Active",deadline});DB.add("activities",{userId:s.id,action:"Created task: "+title,entityType:"task",entityId:DB.get("tasks").length,loggedAt:new Date().toISOString()});showNotif("Task created!","success");$("#taskTitle").value="";$("#taskDesc").value="";$("#taskDeadline").value=""}const tasks=DB.get("tasks").filter(t=>t.teacher_id===s.id);const tbody=$("#taskTable");if(tasks.length){tbody.innerHTML=tasks.map(t=>"<tr><td><strong>"+escapeHtml(t.title)+"</strong></td><td>"+t.type+"</td><td>"+escapeHtml(DB.get("courses").find(c=>c.id===t.course_id)?.code||"-")+"</td><td><span class=\""+getPriorityClass(t.priority)+"\">"+t.priority+"</span></td><td>"+formatDate(t.deadline)+"</td><td><span class=\"badge "+getStatusClass(t.status)+"\">"+t.status+"</span></td></tr>").join("")}else{$tbody.html("<tr><td colspan=\"6\"><div class=\"empty-state\"><i class=\"fas fa-tasks\"></i><p>No tasks yet</p></div></td></tr>")}}</script></body></html>
