<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Activity</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="app-layout">
<header class="topbar-placeholder"></header>
<aside class="sidebar-placeholder"></aside>
<main class="main-content">
<div class="card">
<div class="card-header">Activity Log</div>
<div id="activityList"></div>
</div>
</main>
<footer class="main-footer">&copy; 2026 DIU WorkSync</footer>
</div>
<script src="/js/app.js"></script>
<script src="/js/navbar.js"></script>
<script>
requireAuth(); requireRole("student");
const s = Session.get();
$("#userName").textContent = s.name;

(async function loadActivity() {
  const acts = await apiFetch("/activities");
  if (!acts) return;
  const el = $("#activityList");
  if (acts.length) {
    el.innerHTML = acts.map(a => "<div style='padding:12px 0;border-bottom:1px solid var(--border)'><strong>" + escapeHtml(a.action) + "</strong><br><small class='text-muted'>" + formatDateTime(a.logged_at) + "</small></div>").join("");
  } else {
    el.innerHTML = "<div class='empty-state'><i class='fas fa-history'></i><p>No activity yet</p></div>";
  }
})();
</script>
</body>
</html>
