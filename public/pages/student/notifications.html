<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notifications</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
.notif-item { display:flex; gap:12px; padding:14px; border-radius:10px; margin-bottom:8px; border:1px solid var(--border); transition:all 0.2s; cursor:pointer; }
.notif-item:hover { border-color:var(--primary); }
.notif-item.unread { background:var(--accent-bg); border-color:var(--primary); }
.notif-icon { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.notif-icon.review { background:#d1fae5; color:#065f46; }
.notif-icon.announcement { background:#dbeafe; color:#1e40af; }
.notif-icon.deadline { background:#fef3c7; color:#92400e; }
.notif-icon.default { background:#f3f4f6; color:#6b7280; }
.notif-body { flex:1; }
.notif-msg { font-size:14px; color:var(--text); margin-bottom:4px; }
.notif-time { font-size:11px; color:var(--muted); }
.notif-actions { display:flex; gap:8px; flex-shrink:0; align-items:center; }
.notif-dot { width:8px; height:8px; border-radius:50%; background:var(--primary); flex-shrink:0; }
.empty-notif { text-align:center; padding:40px 20px; color:var(--muted); }
.empty-notif i { font-size:48px; margin-bottom:12px; opacity:0.3; }
.header-actions { display:flex; gap:8px; }
</style>
</head>
<body>
<div class="app-layout">
<header class="topbar">
<div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../../index.html" class="logo">DIU WorkSync</a></div>
<div class="topbar-right">
<button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
<div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span id="roleBadge" class="role-badge role-student">Student</span></div>
<button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button>
</div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
<nav class="sidebar-nav">
<div class="nav-section">Main</div>
<a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
<a href="my-courses.html" class="nav-link"><i class="fas fa-book"></i> My Courses</a>
<a href="my-tasks.html" class="nav-link"><i class="fas fa-tasks"></i> My Tasks</a>
<a href="my-projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> My Projects</a>
<div class="nav-section">More</div>
<a href="my-submissions.html" class="nav-link"><i class="fas fa-file-upload"></i> Submissions</a>
<a href="contribution-report.html" class="nav-link"><i class="fas fa-chart-pie"></i> My Contribution</a>
<a href="peer-feedback.html" class="nav-link"><i class="fas fa-users"></i> Peer Feedback</a>
<a href="project-discussion.html" class="nav-link"><i class="fas fa-comments"></i> Discussion</a>
<a href="activity.html" class="nav-link"><i class="fas fa-history"></i> Activity</a>
<a href="profile.html" class="nav-link"><i class="fas fa-user"></i> Profile</a>
<div class="nav-divider"></div>
<a href="#" class="nav-link logout" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
</nav>
</aside>
<main class="main-content">
<div class="card">
<div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
  <span><i class="fas fa-bell"></i> Notifications</span>
  <div class="header-actions">
    <button class="btn btn-sm btn-outline" onclick="markAllRead()" id="markAllBtn" style="display:none"><i class="fas fa-check-double"></i> Mark All Read</button>
    <button class="btn btn-sm btn-outline" onclick="loadNotifications()"><i class="fas fa-sync"></i></button>
  </div>
</div>
<div id="notifList"></div>
</div>
</main>
<footer class="main-footer">&copy; 2026 DIU WorkSync</footer>
</div>
<script src="/js/app.js"></script>
<script>
requireAuth(); requireRole("student");
const s = Session.get();
$("#userName").textContent = s.name;

let allNotifs = [];

(async function init() {
  await loadNotifications();
})();

async function loadNotifications() {
  const data = await apiFetch("/notifications");
  if (!data) return;
  allNotifs = data.items || [];
  renderNotifs(allNotifs, data.unread);
  updateBadge(data.unread);
}

function renderNotifs(notifs, unreadCount) {
  const el = $("#notifList");
  const markAllBtn = $("#markAllBtn");
  if (unreadCount > 0) {
    markAllBtn.style.display = "inline-flex";
  } else {
    markAllBtn.style.display = "none";
  }
  if (!notifs.length) {
    el.innerHTML = "<div class='empty-notif'><i class='fas fa-bell-slash'></i><p>No notifications yet</p></div>";
    return;
  }
  el.innerHTML = notifs.map(n => {
    const iconClass = n.type === "review" ? "review" : n.type === "announcement" ? "announcement" : n.type === "deadline" ? "deadline" : "default";
    const icon = n.type === "review" ? "fa-check-circle" : n.type === "announcement" ? "fa-bullhorn" : n.type === "deadline" ? "fa-clock" : "fa-bell";
    const unread = !n.is_read;
    return "<div class='notif-item " + (unread ? "unread" : "") + "' onclick='readNotif(" + n.id + ")'>" +
      "<div class='notif-icon " + iconClass + "'><i class='fas " + icon + "'></i></div>" +
      "<div class='notif-body'>" +
        "<div class='notif-msg'>" + escapeHtml(n.message) + "</div>" +
        "<div class='notif-time'>" + formatDateTime(n.created_at) + "</div>" +
      "</div>" +
      (unread ? "<div class='notif-dot'></div>" : "") +
    "</div>";
  }).join("");
}

async function readNotif(id) {
  await apiFetch("/notifications/" + id + "/read", { method: "PUT" });
  const n = allNotifs.find(n => n.id === id);
  if (n) n.is_read = 1;
  const unread = allNotifs.filter(n => !n.is_read).length;
  renderNotifs(allNotifs, unread);
  updateBadge(unread);
}

async function markAllRead() {
  await apiFetch("/notifications/read-all", { method: "PUT" });
  allNotifs.forEach(n => n.is_read = 1);
  renderNotifs(allNotifs, 0);
  updateBadge(0);
}

function updateBadge(count) {
  const badge = $("#annBadge");
  if (!badge) return;
  if (count > 0) {
    badge.textContent = count > 9 ? "9+" : count;
    badge.style.display = "flex";
  } else {
    badge.style.display = "none";
  }
}
</script>
</body>
</html>
