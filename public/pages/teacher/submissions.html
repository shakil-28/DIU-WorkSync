<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Submissions</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="app-layout">
<header class="topbar-placeholder"></header>
<aside class="sidebar-placeholder"></aside>
<main class="main-content">
<div class="card">
<div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
<span><i class="fas fa-file-upload"></i> All Submissions</span>
<button class="btn btn-sm btn-outline" onclick="viewHistory()"><i class="fas fa-history"></i> Review History</button>
</div>
<div class="search-bar">
  <div class="search-icon" style="flex:1">
    <i class="fas fa-search"></i>
    <input type="text" class="search-input" id="subSearch" placeholder="Search submissions..." oninput="applySubFilters()">
  </div>
  <select class="form-control" style="width:auto" id="filterStatus" onchange="applySubFilters()">
    <option value="">All Status</option>
    <option value="Pending">Pending</option>
    <option value="Approved">Approved</option>
    <option value="Revision Requested">Revision Requested</option>
    <option value="Rejected">Rejected</option>
  </select>
</div>
<div id="subResultsCount" class="results-count"></div>
<div class="table-responsive">
<table>
<tr><th>Student</th><th>Task</th><th>File</th><th>Submitted</th><th>Score</th><th>Status</th><th>Review</th><th>Actions</th></tr>
<tbody id="subTable"></tbody>
</table>
</div>
</div>
<div id="subPagination"></div>
</main>
<footer class="main-footer">&copy; 2026 DIU WorkSync</footer>

<!-- Review Modal -->
<div id="reviewModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center">
<div class="card" style="max-width:500px;width:90%">
<div class="card-header">
<span><i class="fas fa-check-circle"></i> Review Submission</span>
<button onclick="closeReviewModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;position:absolute;right:15px;top:15px">&times;</button>
</div>
<form onsubmit="saveReview(event)">
<input type="hidden" id="reviewSubId">
<div class="form-group"><label>Score (0-100)</label><input type="number" class="form-control" id="reviewScore" min="0" max="100" required></div>
<div class="form-group">
<label>Status</label>
<select class="form-control" id="reviewStatus">
<option value="Approved">Approved</option>
<option value="Revision Requested">Revision Requested</option>
<option value="Rejected">Rejected</option>
</select>
</div>
<div class="form-group"><label>Feedback</label><textarea class="form-control" id="reviewFeedback" rows="3" placeholder="Enter feedback for the student..."></textarea></div>
<div style="display:flex;gap:10px">
<button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Review</button>
<button type="button" class="btn btn-outline" onclick="closeReviewModal()"><i class="fas fa-times"></i> Cancel</button>
</div>
</form>
</div>
</div>

<!-- Review History Modal -->
<div id="historyModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center">
<div class="card" style="max-width:700px;width:90%;max-height:80vh;overflow-y:auto">
<div class="card-header">
<span><i class="fas fa-history"></i> Review History</span>
<button onclick="closeHistoryModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;position:absolute;right:15px;top:15px">&times;</button>
</div>
<div id="historyList"></div>
</div>
</div>

<script src="/js/app.js"></script>
<script src="/js/navbar.js"></script>
<script>
requireAuth(); requireRole("teacher");
const s = Session.get();
$("#userName").textContent = s.name;

let allSubmissions = [];
let subPage = 1;
const SUBS_PER_PAGE = 8;

(async function loadSubmissions() {
  allSubmissions = await apiFetch("/submissions");
  if (!allSubmissions) return;
  applySubFilters();
})();

function applySubFilters() {
  const query = ($("#subSearch").value || "").trim();
  const status = $("#filterStatus").value;
  let filtered = allSubmissions;
  if (query) filtered = filtered.filter(sub => (sub.student_name || "").toLowerCase().includes(query.toLowerCase()) || (sub.task_title || "").toLowerCase().includes(query.toLowerCase()));
  if (status === "Pending") filtered = filtered.filter(sub => !sub.review_status);
  else if (status) filtered = filtered.filter(sub => sub.review_status === status);
  const total = filtered.length;
  const totalPages = Math.ceil(total / SUBS_PER_PAGE) || 1;
  const safePage = Math.min(subPage, totalPages);
  const start = (safePage - 1) * SUBS_PER_PAGE;
  const result = { items: filtered.slice(start, start + SUBS_PER_PAGE), total, page: safePage, totalPages };
  renderSubmissions(result.items, result);
}

function renderSubmissions(subs, pagInfo) {
  const tbody = $("#subTable");
  const countEl = $("#subResultsCount");
  const pageEl = $("#subPagination");
  if (countEl) countEl.textContent = pagInfo ? (pagInfo.total === allSubmissions.length ? "Showing all " + pagInfo.total + " submissions" : "Showing " + pagInfo.items.length + " of " + pagInfo.total + " submissions") : "";
  if (subs.length) {
    tbody.innerHTML = subs.map(sub => {
      const hasFile = sub.file_path ? true : false;
      const fileIcon = hasFile ? '<i class="fas fa-paperclip" style="color:var(--primary)"></i>' : '<i class="fas fa-comment" style="color:var(--muted)"></i>';
      const downloadBtn = hasFile ? `<a href="/uploads/${sub.file_path.split('/').pop()}" download class="btn btn-sm btn-outline"><i class="fas fa-download"></i></a>` : '';
      const scoreDisplay = sub.score !== null && sub.score !== undefined ? `<strong>${sub.score}</strong>/100` : '<span class="text-muted">-</span>';
      const reviewBtn = !sub.review_status ? `<button class="btn btn-sm btn-primary" onclick="openReview(${sub.id})"><i class="fas fa-check"></i> Review</button>` : '<span class="text-muted">Reviewed</span>';
      return "<tr>" +
        "<td><strong>" + escapeHtml(sub.student_name) + "</strong></td>" +
        "<td>" + escapeHtml(sub.task_title) + "</td>" +
        "<td>" + fileIcon + "</td>" +
        "<td>" + formatDateTime(sub.submitted_at) + "</td>" +
        "<td>" + scoreDisplay + "</td>" +
        "<td><span class='badge " + getStatusClass(sub.review_status || "Pending") + "'>" + (sub.review_status || "Pending") + "</span></td>" +
        "<td>" + (sub.review_status ? "<span class='text-muted'>" + escapeHtml(sub.feedback ? "See details" : "-") + "</span>" : "-") + "</td>" +
        "<td>" +
          reviewBtn + " " +
          downloadBtn +
        "</td>" +
      "</tr>";
    }).join("");
  } else {
    tbody.innerHTML = "<tr><td colspan='8'><div class='empty-state'><i class='fas fa-file-upload'></i><p>No submissions found</p></div></td></tr>";
  }
  if (pageEl) pageEl.innerHTML = renderPagination(pagInfo?.page || 1, pagInfo?.totalPages || 1, "function(p){subPage=getPagination(p,"+pagInfo?.totalPages+"||1,"+SUBS_PER_PAGE+");applySubFilters();}");
}

function openReview(id) {
  const sub = allSubmissions.find(s => s.id === id);
  if (!sub) return;
  $("#reviewSubId").value = id;
  $("#reviewScore").value = sub.score || "";
  $("#reviewStatus").value = "Approved";
  $("#reviewFeedback").value = sub.feedback || "";
  $("#reviewModal").style.display = "flex";
}

function closeReviewModal() {
  $("#reviewModal").style.display = "none";
}

async function saveReview(e) {
  e.preventDefault();
  const id = $("#reviewSubId").value;
  const score = parseInt($("#reviewScore").value);
  const status = $("#reviewStatus").value;
  const feedback = $("#reviewFeedback").value.trim();
  
  const r = await apiFetch("/submissions/" + id + "/review", { 
    method: "POST", 
    body: JSON.stringify({ score, status, feedback }) 
  });
  if (r) { 
    showNotif("Review saved!", "success"); 
    closeReviewModal();
    // Refresh submissions list without full page reload
    allSubmissions = await apiFetch("/submissions");
    if (allSubmissions) applySubFilters();
  }
}

async function viewHistory() {
  const reviews = await apiFetch("/task_reviews");
  if (!reviews) return;
  
  if (reviews.length) {
    $("#historyList").innerHTML = reviews.map(r => 
      "<div style='padding:15px;border-bottom:1px solid var(--border)'>" +
        "<div style='display:flex;justify-content:space-between;margin-bottom:10px'>" +
          "<strong>" + escapeHtml(r.student_name) + "</strong>" +
          "<span class='badge " + getStatusClass(r.status) + "'>" + r.status + "</span>" +
        "</div>" +
        "<p><strong>Task:</strong> " + escapeHtml(r.task_title) + "</p>" +
        "<p><strong>Score:</strong> " + r.score + "/100</p>" +
        "<p><strong>Feedback:</strong> " + escapeHtml(r.feedback || "No feedback") + "</p>" +
        "<small class='text-muted'>" + formatDateTime(r.reviewed_at) + "</small>" +
      "</div>"
    ).join("");
  } else {
    $("#historyList").innerHTML = "<div class='empty-state'><i class='fas fa-history'></i><p>No reviews yet</p></div>";
  }
  
  $("#historyModal").style.display = "flex";
}

function closeHistoryModal() {
  $("#historyModal").style.display = "none";
}

document.addEventListener("click", (e) => {
  if (e.target.id === "reviewModal") closeReviewModal();
  if (e.target.id === "historyModal") closeHistoryModal();
});
</script>

<script>
// Mobile table converter - transforms tables to card layout on small screens
function makeTablesMobileResponsive(){
  const isMobile=window.innerWidth<=640;
  document.querySelectorAll('table').forEach(table=>{
    const wrapper=table.parentElement;
    if(!wrapper.classList.contains('table-responsive'))return;
    if(isMobile){
      if(!table.classList.contains('mobile-converted')){
        table.querySelectorAll('tr').forEach(tr=>{
          tr.querySelectorAll('td').forEach((td,i)=>{
            const th=table.querySelector('thead th:nth-child('+(i+1)+')');
            const label=th?th.textContent.trim():'Cell '+(i+1);
            td.setAttribute('data-label',label);
          });
        });
        table.classList.add('mobile-converted');
      }
    }else{
      table.querySelectorAll('[data-label]').forEach(td=>td.removeAttribute('data-label'));
      table.classList.remove('mobile-converted');
    }
  });
}
window.addEventListener('load',makeTablesMobileResponsive);
window.addEventListener('resize',()=>{clearTimeout(window._tblTimeout);window._tblTimeout=setTimeout(makeTablesMobileResponsive,150)});
</script>

<script>
(function(){
  function convertTables(){
    var isMobile=window.innerWidth<=640;
    document.querySelectorAll('table').forEach(function(table){
      var wrapper=table.parentElement;
      if(!wrapper||!wrapper.classList.contains('table-responsive'))return;
      table.querySelectorAll('tr').forEach(function(tr){
        tr.querySelectorAll('td').forEach(function(td,i){
          var th=table.querySelector('thead th:nth-child('+(i+1)+')');
          var label=th?th.textContent.trim():'Cell '+(i+1);
          if(isMobile){td.setAttribute('data-label',label)}
          else{td.removeAttribute('data-label')}
        });
      });
    });
  }
  convertTables();
  window.addEventListener('resize',function(){clearTimeout(window._rt);window._rt=setTimeout(convertTables,200)});
})();
</script>
</body>
</html>
