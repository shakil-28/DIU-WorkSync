</head>
<body>
<div class="app-layout">
<header class="topbar">
<div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../../index.html" class="logo">DIU WorkSync</a></div>

<button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button>
</div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
<nav class="sidebar-nav">
<div class="nav-section">Main</div>
<a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
<a href="courses.html" class="nav-link active"><i class="fas fa-book"></i> Courses</a>
<a href="projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Projects</a>

<main class="main-content">
<div class="card">
<div class="card-header">Create New Course</div>
<form onsubmit="createCourse(event)">
<div style="display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:15px">
<div class="form-group"><label>Course Code</label><input type="text" class="form-control" id="courseCode" required placeholder="CSE-307"></div>
<div class="form-group"><label>Course Name</label><input type="text" class="form-control" id="courseName" required placeholder="Web Engineering"></div>
<div class="form-group"><label>Semester</label><input type="text" class="form-control" id="courseSem" required placeholder="Spring 2026"></div>
<div class="form-group" style="display:flex;align-items:flex-end"><button type="submit" class="btn btn-primary btn-block">Create</button></div>
</div>
</form>
</div>
<div class="card">
<div class="card-header">My Courses</div>
<div class="search-bar">
  <div class="search-icon" style="flex:1">
    <i class="fas fa-search"></i>
    <input type="text" class="search-input" id="courseSearch" placeholder="Search courses..." oninput="applyCourseFilters()">
  </div>
</div>
<div id="courseResultsCount" class="results-count"></div>
<div class="table-responsive">
<table>
<tr><th>Code</th><th>Name</th><th>Semester</th><th>Students</th><th>Action</th></tr>
<tbody id="courseTable"></tbody>
</table>
</div>
<div id="coursePagination"></div>
</div>
</main>
<footer class="main-footer">&copy; 2026 DIU WorkSync</footer>
</div>
<script src="/js/app.js"></script>
<script>
requireAuth(); requireRole("teacher");
const s = Session.get();
$("#userName").textContent = s.name;

async function createCourse(e) {
  e.preventDefault();
  const code = $("#courseCode").value.trim();
  const name = $("#courseName").value.trim();
  const sem = $("#courseSem").value.trim();
  const r = await apiFetch("/courses", { method: "POST", body: JSON.stringify({ code, name, semester: sem }) });
  if (r) {
    showNotif("Course created!", "success");
    $("#courseCode").value = ""; $("#courseName").value = ""; $("#courseSem").value = "";
    loadCourses();
  } else {
    showNotif("Failed to create course", "danger");
  }
}

let allCourses = [];
let coursePage = 1;
const COURSES_PER_PAGE = 8;

async function loadCourses() {
  allCourses = await apiFetch("/courses");
  if (!allCourses) return;
  applyCourseFilters();
}

function applyCourseFilters() {
  const query = ($("#courseSearch").value || "").trim();
  const result = applyFilters(allCourses, query, {}, coursePage, COURSES_PER_PAGE);
  renderCourses(result.items, result);
}

function renderCourses(courses, pagInfo) {
  const tbody = $("#courseTable");
  const countEl = $("#courseResultsCount");
  const pageEl = $("#coursePagination");
  if (countEl) countEl.textContent = pagInfo ? (pagInfo.total === allCourses.length ? "Showing all " + pagInfo.total + " courses" : "Showing " + pagInfo.items.length + " of " + pagInfo.total + " courses") : "";
  if (courses.length) {
    tbody.innerHTML = courses.map(c =>
      "<tr><td><strong>" + escapeHtml(c.course_code) + "</strong></td<td>" + escapeHtml(c.course_name) + "</td><td>" + escapeHtml(c.semester) + "</td><td>" + (c.student_count || 0) + "</td><td><a href='/pages/teacher/course-detail.html?id=" + c.id + "' class='btn btn-sm btn-outline'>View</a></td</tr>"
    ).join("");
  } else {
    tbody.innerHTML = "<tr><td colspan='5'><div class='empty-state'><i class='fas fa-book'></i><p>No courses found</p></div></td></tr>";
  }
  if (pageEl) pageEl.innerHTML = renderPagination(pagInfo?.page || 1, pagInfo?.totalPages || 1, "function(p){coursePage=getPagination(p,"+pagInfo?.totalPages+"||1,"+COURSES_PER_PAGE+");applyCourseFilters();}");
}

loadCourses();
</script>

<script>
// Mobile table converter - transforms tables to card layout on small screens
function makeTablesMobileResponsive(){
  const isMobile=window.innerWidth<=640;
  document.querySelectorAll('table').forEach(table=>{
    const wrapper=table.parentElement;
    if(!wrapper.classList.contains('table-responsive'))return;
    if(isMobile){
      if(!table.classList.contains('mobile-converted')){
        table.querySelectorAll('tr').forEach(tr=>{
          tr.querySelectorAll('td').forEach((td,i)=>{
            const th=table.querySelector('thead th:nth-child('+(i+1)+')');
            const label=th?th.textContent.trim():'Cell '+(i+1);
            td.setAttribute('data-label',label);
          });
        });
        table.classList.add('mobile-converted');
      }
    }else{
      table.querySelectorAll('[data-label]').forEach(td=>td.removeAttribute('data-label'));
      table.classList.remove('mobile-converted');
    }
  });
}
window.addEventListener('load',makeTablesMobileResponsive);
window.addEventListener('resize',()=>{clearTimeout(window._tblTimeout);window._tblTimeout=setTimeout(makeTablesMobileResponsive,150)});
</script>

<script>
(function(){
  function convertTables(){
    var isMobile=window.innerWidth<=640;
    document.querySelectorAll('table').forEach(function(table){
      var wrapper=table.parentElement;
      if(!wrapper||!wrapper.classList.contains('table-responsive'))return;
      table.querySelectorAll('tr').forEach(function(tr){
        tr.querySelectorAll('td').forEach(function(td,i){
          var th=table.querySelector('thead th:nth-child('+(i+1)+')');
          var label=th?th.textContent.trim():'Cell '+(i+1);
          if(isMobile){td.setAttribute('data-label',label)}
          else{td.removeAttribute('data-label')}
        });
      });
    });
  }
  convertTables();
  window.addEventListener('resize',function(){clearTimeout(window._rt);window._rt=setTimeout(convertTables,200)});
})();
</script>
</body>
</html>
