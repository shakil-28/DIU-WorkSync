<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile - Teacher</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
.avatar-upload { text-align:center;margin-bottom:24px; }
.avatar-circle { width:90px; height:90px; border-radius:50%; background:var(--primary); color:#fff; font-size:36px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; font-weight:700; }
.form-section { margin-top:24px; padding-top:24px; border-top:1px solid var(--border); }
.form-section h4 { margin:0 0 16px 0; font-size:15px; display:flex; align-items:center; gap:8px; }
.password-field { position:relative; }
.password-field .toggle-pw { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); font-size:14px; }
.alert-pw { font-size:12px; margin-top:4px; }
.alert-pw.error { color:var(--danger); }
.alert-pw.success { color:var(--secondary); }
</style>
</head>
<body>
<div class="app-layout">
<header class="topbar">
<div class="topbar-left"><button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button><a href="../../index.html" class="logo">DIU WorkSync</a></div>
<div class="topbar-right">
<button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
<div class="user-info"><i class="fas fa-user-circle"></i><span id="userName"></span><span id="roleBadge" class="role-badge role-teacher">Teacher</span></div>
<button class="logout-btn" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i></button>
</div>
</header>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
<nav class="sidebar-nav">
<div class="nav-section">Main</div>
<a href="dashboard.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
<a href="courses.html" class="nav-link"><i class="fas fa-book"></i> Courses</a>
<a href="projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Projects</a>
<a href="tasks.html" class="nav-link"><i class="fas fa-tasks"></i> Tasks</a>
<div class="nav-section">Management</div>
<a href="submissions.html" class="nav-link"><i class="fas fa-file-upload"></i> Submissions</a>
<a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i> Reports</a>
<a href="announcements.html" class="nav-link"><i class="fas fa-bullhorn"></i> Announcements</a>
<a href="peer-reviews.html" class="nav-link"><i class="fas fa-users"></i> Peer Reviews</a>
<a href="project-discussion.html" class="nav-link"><i class="fas fa-comments"></i> Discussions</a>
<div class="nav-divider"></div>
<a href="activity.html" class="nav-link"><i class="fas fa-history"></i> Activity Log</a>
<a href="profile.html" class="nav-link active"><i class="fas fa-user"></i> Profile</a>
<a href="#" class="nav-link logout" onclick="Session.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
</nav>
</aside>
<main class="main-content">
<div class="card" style="max-width:560px">
<div class="card-header"><i class="fas fa-user-circle"></i> My Profile</div>
<div class="avatar-upload">
  <div class="avatar-circle" id="avatarCircle">T</div>
  <div class="avatar-label"><i class="fas fa-camera"></i> Photo coming soon</div>
</div>
<form onsubmit="saveProfile(event)">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
    <div class="form-group"><label>Full Name</label><input type="text" class="form-control" id="profName" required></div>
    <div class="form-group"><label>Email</label><input type="email" class="form-control" id="profEmail" disabled style="opacity:0.7"></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
    <div class="form-group"><label>Phone</label><input type="text" class="form-control" id="profPhone" placeholder="Optional"></div>
    <div class="form-group"><label>GitHub Username</label><input type="text" class="form-control" id="profGithub" placeholder="e.g. johndoe"></div>
  </div>
  <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
</form>
<div class="form-section">
  <h4><i class="fas fa-key"></i> Change Password</h4>
  <form onsubmit="changePassword(event)">
    <div class="form-group"><label>Current Password</label>
      <div class="password-field">
        <input type="password" class="form-control" id="currPass" required>
        <button type="button" class="toggle-pw" onclick="togglePw('currPass')"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <div class="form-group"><label>New Password</label>
      <div class="password-field">
        <input type="password" class="form-control" id="newPass" required minlength="6">
        <button type="button" class="toggle-pw" onclick="togglePw('newPass')"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <div class="form-group"><label>Confirm New Password</label>
      <div class="password-field">
        <input type="password" class="form-control" id="confPass" required minlength="6">
        <button type="button" class="toggle-pw" onclick="togglePw('confPass')"><i class="fas fa-eye"></i></button>
      </div>
    </div>
    <div id="pwMsg"></div>
    <button type="submit" class="btn btn-outline" style="border-color:var(--danger);color:var(--danger)"><i class="fas fa-key"></i> Update Password</button>
  </form>
</div>
</div>
</main>
<footer class="main-footer">&copy; 2026 DIU WorkSync</footer>
</div>
<script src="/js/app.js"></script>
<script>
requireAuth(); requireRole("teacher");
const s = Session.get();
$("#userName").textContent = s.name;
$("#avatarCircle").textContent = (s.name || "T")[0].toUpperCase();

(async function loadProfile() {
  const user = await apiFetch("/users/me");
  if (!user) return;
  $("#profName").value = user.name;
  $("#profEmail").value = user.email;
  $("#profPhone").value = user.phone || "";
  $("#profGithub").value = user.github_username || "";
})();

async function saveProfile(e) {
  e.preventDefault();
  const name = $("#profName").value.trim();
  const phone = $("#profPhone").value.trim();
  const github = $("#profGithub").value.trim();
  const r = await apiFetch("/users/profile", { method: "PUT", body: JSON.stringify({ name, phone, github }) });
  if (r?.success) {
    s.name = name;
    localStorage.setItem("ws_user", JSON.stringify(s));
    $("#userName").textContent = name;
    $("#avatarCircle").textContent = name[0].toUpperCase();
    showNotif("Profile updated!", "success");
  }
}

function togglePw(id) {
  const inp = document.getElementById(id);
  const icon = inp.parentElement.querySelector(".toggle-pw i");
  inp.type = inp.type === "password" ? "text" : "password";
  icon.classList.toggle("fa-eye");
  icon.classList.toggle("fa-eye-slash");
}

async function changePassword(e) {
  e.preventDefault();
  const curr = $("#currPass").value;
  const newPw = $("#newPass").value;
  const conf = $("#confPass").value;
  const msg = $("#pwMsg");
  if (newPw !== conf) { msg.innerHTML = "<p class='alert-pw error'>Passwords do not match</p>"; return; }
  if (newPw.length < 6) { msg.innerHTML = "<p class='alert-pw error'>Password must be at least 6 characters</p>"; return; }
  const r = await apiFetch("/users/change-password", { method: "POST", body: JSON.stringify({ current_password: curr, new_password: newPw }) });
  if (r?.success) {
    msg.innerHTML = "<p class='alert-pw success'><i class='fas fa-check'></i> Password updated successfully!</p>";
    $("#currPass").value = ""; $("#newPass").value = ""; $("#confPass").value = "";
  } else {
    msg.innerHTML = "<p class='alert-pw error'><i class='fas fa-exclamation-circle'></i> " + (r?.error || "Failed") + "</p>";
  }
}
</script>
</body>
</html>
