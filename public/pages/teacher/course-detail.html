<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Course Detail</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="app-layout">
<header class="topbar-placeholder"></header>
<aside class="sidebar-placeholder"></aside>
<main class="main-content">
<a href="courses.html" class="btn btn-outline" style="margin-bottom:20px"><i class="fas fa-arrow-left"></i> Back to Courses</a>

<div class="card">
<div class="card-header">
<span id="courseTitle"><i class="fas fa-spinner fa-spin"></i> Loading...</span>
<span class="badge badge-active" id="courseBadge">Active</span>
</div>
<div id="courseInfo" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px"></div>
</div>

<div style="display:grid;grid-template-columns:2fr 1fr;gap:24px">
<div>
<div class="card">
<div class="card-header">
<span><i class="fas fa-users"></i> Enrolled Students</span>
<button class="btn btn-sm btn-primary" onclick="showAddStudent()"><i class="fas fa-plus"></i> Add Student</button>
</div>
<div id="studentList"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div></div>
</div>

<div class="card">
<div class="card-header"><i class="fas fa-project-diagram"></i> Projects</div>
<div id="projectList"><div class="empty-state"><i class="fas fa-check-circle"></i><p>No projects yet</p></div></div>
</div>

<div class="card">
<div class="card-header"><i class="fas fa-tasks"></i> Tasks</div>
<div id="taskList"><div class="empty-state"><i class="fas fa-check-circle"></i><p>No tasks yet</p></div></div>
</div>
</div>

<div>
<div class="card">
<div class="card-header"><i class="fas fa-chart-pie"></i> Statistics</div>
<div id="statsContent"></div>
</div>
</div>
</div>

<!-- Add Student Modal -->
<div id="addStudentModal" class="modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center">
<div class="card" style="max-width:400px;width:90%">
<div class="card-header">
<span><i class="fas fa-user-plus"></i> Add Student</span>
<button onclick="hideAddStudent()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;position:absolute;right:15px;top:15px">&times;</button>
</div>
<div class="form-group"><label>Search Student</label><input type="text" class="form-control" id="studentSearch" placeholder="Type name or email..." oninput="filterStudents()"></div>
<div id="studentSelectList" style="max-height:200px;overflow-y:auto;margin-bottom:15px"></div>
<button class="btn btn-primary" onclick="addSelectedStudent()" id="addStudentBtn" disabled><i class="fas fa-plus"></i> Add to Course</button>
</div>
</div>
</main>
<footer class="main-footer">&copy; 2026 DIU WorkSync</footer>
</div>
<script src="/js/app.js"></script>
<script src="/js/navbar.js"></script>
<script>
requireAuth(); requireRole("teacher");
const s = Session.get();
$("#userName").textContent = s.name;

const params = new URLSearchParams(window.location.search);
const courseId = params.get("id");

let students, courseData;
let allStudents = [];
let selectedStudentId = null;

(async function init() {
  if (!courseId) { window.location.href = "/pages/teacher/courses.html"; return; }
  
  [students, courseData] = await Promise.all([
    apiFetch("/users"),
    apiFetch("/courses/" + courseId)
  ]);
  
  if (!courseData || !courseData.course) {
    window.location.href = "/pages/teacher/courses.html";
    return;
  }
  
  const c = courseData.course;
  $("#courseTitle").innerHTML = escapeHtml(c.course_name) + ' <small class="text-muted">(' + escapeHtml(c.course_code) + ')</small>';
  
  $("#courseInfo").innerHTML = `
    <div><strong>Semester:</strong> ${escapeHtml(c.semester || "-")}</div>
    <div><strong>Created:</strong> ${formatDate(c.created_at)}</div>
    <div><strong>Teacher:</strong> ${escapeHtml(s.name)}</div>
    <div><strong>Students:</strong> ${c.student_count || 0}</div>
  `;
  
  // Render students
  const enrolledStudents = courseData.students || [];
  allStudents = students || [];
  
  if (enrolledStudents.length) {
    $("#studentList").innerHTML = "<ul class='task-list'>" + enrolledStudents.map(st => 
      "<li><div class='task-info'><strong>" + escapeHtml(st.name) + "</strong><small>" + escapeHtml(st.email) + "</small></div></li>"
    ).join("") + "</ul>";
  } else {
    $("#studentList").innerHTML = "<div class='empty-state'><i class='fas fa-users'></i><p>No students enrolled</p></div>";
  }
  
  // Render projects
  const projects = courseData.projects || [];
  if (projects.length) {
    $("#projectList").innerHTML = "<ul class='task-list'>" + projects.map(p => 
      "<li><div class='task-info'><strong>" + escapeHtml(p.title) + "</strong></div><span class='badge " + getStatusClass(p.status) + "'>" + p.status + "</span></li>"
    ).join("") + "</ul>";
  } else {
    $("#projectList").innerHTML = "<div class='empty-state'><i class='fas fa-project-diagram'></i><p>No projects yet</p></div>";
  }
  
  // Render tasks
  const tasks = courseData.tasks || [];
  if (tasks.length) {
    $("#taskList").innerHTML = "<ul class='task-list'>" + tasks.map(t => 
      "<li><div class='task-info'><strong>" + escapeHtml(t.title) + "</strong><small>" + t.type + " | " + (t.deadline ? formatDate(t.deadline) : "") + "</small></div><span class='badge " + getStatusClass(t.status) + "'>" + t.status + "</span></li>"
    ).join("") + "</ul>";
  } else {
    $("#taskList").innerHTML = "<div class='empty-state'><i class='fas fa-tasks'></i><p>No tasks yet</p></div>";
  }
  
  // Stats
  const completedTasks = tasks.filter(t => t.status === "Completed").length;
  const pendingTasks = tasks.filter(t => t.status === "Pending" || t.status === "Active").length;
  $("#statsContent").innerHTML = `
    <div style='margin-bottom:15px'><strong>Projects:</strong> ${projects.length}</div>
    <div style='margin-bottom:15px'><strong>Total Tasks:</strong> ${tasks.length}</div>
    <div style='margin-bottom:15px'><strong>Completed:</strong> <span style='color:var(--secondary)'>${completedTasks}</span></div>
    <div style='margin-bottom:15px'><strong>Pending:</strong> <span style='color:var(--warning)'>${pendingTasks}</span></div>
    <div><strong>Students:</strong> ${enrolledStudents.length}</div>
  `;
})();

function showAddStudent() {
  $("#addStudentModal").style.display = "flex";
  $("#studentSearch").value = "";
  filterStudents();
}

function hideAddStudent() {
  $("#addStudentModal").style.display = "none";
  selectedStudentId = null;
  $("#addStudentBtn").disabled = true;
}

function filterStudents() {
  const query = $("#studentSearch").value.toLowerCase();
  const enrolledIds = new Set((courseData?.students || []).map(st => st.id));
  const filtered = allStudents.filter(st =>
    st.role === "student" &&
    !enrolledIds.has(st.id) &&
    (st.name.toLowerCase().includes(query) || st.email.toLowerCase().includes(query))
  );
  
  if (filtered.length) {
    $("#studentSelectList").innerHTML = filtered.map(st => 
      `<div style="padding:10px;border-bottom:1px solid var(--border);cursor:pointer" onclick="selectStudent(${st.id}, this)">
        <strong>${escapeHtml(st.name)}</strong><br>
        <small class="text-muted">${escapeHtml(st.email)}</small>
      </div>`
    ).join("");
  } else {
    $("#studentSelectList").innerHTML = "<div class='empty-state'><p>No students found</p></div>";
  }
}

function selectStudent(studentId, el) {
  selectedStudentId = studentId;
  document.querySelectorAll("#studentSelectList > div").forEach(d => d.style.background = "");
  el.style.background = "var(--primary)";
  el.style.color = "#fff";
  $("#addStudentBtn").disabled = false;
}

async function addSelectedStudent() {
  if (!selectedStudentId || !courseId) return;
  const r = await apiFetch("/courses/" + courseId + "/students", { 
    method: "POST", 
    body: JSON.stringify({ student_id: selectedStudentId }) 
  });
  if (r) {
    showNotif("Student added!", "success");
    hideAddStudent();
    window.location.reload();
  } else {
    showNotif("Failed to add student", "danger");
  }
}

document.addEventListener("click", (e) => {
  if (e.target.id === "addStudentModal") hideAddStudent();
});
</script>
</body>
</html>
