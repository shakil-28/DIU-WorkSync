<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tasks</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="app-layout">
<header class="topbar-placeholder"></header>
<aside class="sidebar-placeholder"></aside>
<main class="main-content">
<div class="card">
<div class="card-header">Create Task</div>
<form onsubmit="createTask(event)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:15px">
<div class="form-group"><label>Course</label><select class="form-control" id="taskCourse" required></select></div>
<div class="form-group"><label>Task Type</label><select class="form-control" id="taskType"><option>Assignment</option><option>Group Project</option><option>Presentation</option><option>Lab Work</option><option>Lab Report</option><option>Research Work</option><option>Exam Preparation</option><option>Other</option></select></div>
<div class="form-group" style="grid-column:1/-1"><label>Title</label><input type="text" class="form-control" id="taskTitle" required></div>
<div class="form-group" style="grid-column:1/-1"><label>Description</label><textarea class="form-control" id="taskDesc" rows="3"></textarea></div>
<div class="form-group"><label>Priority</label><select class="form-control" id="taskPriority"><option>High</option><option>Medium</option><option>Low</option></select></div>
<div class="form-group"><label>Deadline</label><input type="date" class="form-control" id="taskDeadline"></div>
<div class="form-group"><label>Assignment Type</label>
  <select class="form-control" id="taskAssignmentType" onchange="toggleTaskProjectField()">
    <option value="Individual">Individual</option>
    <option value="Group Shared">Group Shared (entire project group)</option>
    <option value="Group Divided">Group Divided (per-student within group)</option>
  </select>
</div>
<div class="form-group" id="taskProjectField" style="display:none">
  <label>Project Group</label>
  <select class="form-control" id="taskProject"></select>
  <small class="form-text">Required for Group Shared / Group Divided tasks</small>
</div>
</div>
<button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Task</button>
</form>
</div>
<div class="card">
<div class="card-header">All Tasks</div>
<div class="search-bar">
  <div class="search-icon" style="flex:1">
    <i class="fas fa-search"></i>
    <input type="text" class="search-input" id="taskSearch" placeholder="Search tasks..." oninput="applyTaskFilters()">
  </div>
  <div class="filter-group">
    <select class="form-control" style="width:auto" id="taskFilterPriority" onchange="applyTaskFilters()">
      <option value="">All Priorities</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <select class="form-control" style="width:auto" id="taskFilterStatus" onchange="applyTaskFilters()">
      <option value="">All Status</option>
      <option value="Active">Active</option>
      <option value="Completed">Completed</option>
      <option value="Overdue">Overdue</option>
    </select>
    <select class="form-control" style="width:auto" id="taskFilterCourse" onchange="applyTaskFilters()">
      <option value="">All Courses</option>
    </select>
  </div>
</div>
<div id="taskResultsCount" class="results-count"></div>
<div class="table-responsive">
<table>
<tr><th>Title</th><th>Type</th><th>Course</th><th>Assign. Type</th><th>Project</th><th>Priority</th><th>Deadline</th><th>Assigned</th><th>Actions</th></tr>
<tbody id="taskTable"></tbody>
</table>
</div>
</div>
<div id="taskPagination"></div>
</main>


<!-- Assign Task Modal -->
<div id="assignModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center">
<div class="card" style="max-width:550px;width:90%">
<div class="card-header">
  <span><i class="fas fa-user-plus"></i> Assign Task</span>
  <button onclick="closeAssignModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;position:absolute;right:15px;top:15px">&times;</button>
</div>
<form onsubmit="assignTask(event)">
<input type="hidden" id="assignTaskId">
<div class="form-group">
  <label>Task</label>
  <input type="text" class="form-control" id="assignTaskTitle" readonly style="background:var(--input-bg)">
</div>
<div class="form-group">
  <label>Assignment Type</label>
  <select class="form-control" id="assignAssignmentType" onchange="toggleAssignFields()">
    <option value="Individual">Individual — assign to one student</option>
    <option value="Group Shared">Group Shared — assign to all project members</option>
    <option value="Group Divided">Group Divided — one sub-task per member</option>
  </select>
  <small class="form-text">Change if you want to re-assign with a different type</small>
</div>
<div id="assignProjectField" class="form-group" style="display:none">
  <label>Project Group</label>
  <select class="form-control" id="assignProject" onchange="loadGroupMembers()">
    <option value="">— Select a project —</option>
  </select>
</div>
<div id="assignIndividualField">
  <div class="form-group"><label>Student</label><select class="form-control" id="assignStudent"></select></div>
</div>
<div id="assignGroupInfo" style="display:none;margin-bottom:10px;padding:10px;background:var(--card-bg);border-radius:6px;border:1px solid var(--border-color)">
  <strong id="assignGroupLabel"></strong>
  <div id="assignGroupTypeHint" style="margin-top:4px;font-size:0.85rem;color:var(--primary)"></div>
  <div id="assignGroupMembers" style="margin-top:5px;font-size:0.9rem;color:var(--muted)"></div>
</div>
<div class="form-group">
  <label>Weight (%)</label>
  <input type="number" class="form-control" id="assignWeight" min="0" max="100" placeholder="0–100">
  <small class="form-text" id="weightHint">Enter value between 0–100</small>
</div>
<div class="form-group"><label>Deadline</label><input type="date" class="form-control" id="assignDeadline"></div>
<div style="display:flex;gap:10px;margin-top:15px">
  <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Assign</button>
  <button type="button" class="btn btn-outline" onclick="closeAssignModal()"><i class="fas fa-times"></i> Cancel</button>
</div>
</form>
</div>
</div>

<!-- Manage Assignments Modal -->
<div id="manageModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center">
<div class="card" style="max-width:650px;width:90%">
<div class="card-header">
  <span><i class="fas fa-tasks"></i> Manage Assignments</span>
  <button onclick="closeManageModal()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;position:absolute;right:15px;top:15px">&times;</button>
</div>
<div id="assignList"></div>
</div>
</div>

<script src="/js/app.js"></script>
<script src="/js/navbar.js"></script>
<script>
requireAuth(); requireRole("teacher");
const s = Session.get();
$("#userName").textContent = s.name;

let courses = [];
let allStudents = [];
let allTasks = [];
let allProjects = [];
let occupiedStudents = new Set();
let projectMemberIds = new Set();
let taskAssignedIds = new Set();
let taskPage = 1;
let allTasksAssignments = [];
const TASKS_PER_PAGE = 10;

(async function init() {
  [courses, allStudents, allProjects] = await Promise.all([
    apiFetch("/courses"),
    apiFetch("/users"),
    apiFetch("/projects")
  ]);
  if (!courses) return;
  $("#taskCourse").innerHTML = courses.map(c => "<option value='" + c.id + "'>" + escapeHtml(c.course_code) + " - " + escapeHtml(c.course_name) + "</option>").join("");
  $("#taskFilterCourse").innerHTML = "<option value=''>All Courses</option>" + courses.map(c => "<option value='" + c.id + "'>" + escapeHtml(c.course_code) + " - " + escapeHtml(c.course_name) + "</option>").join("");
  loadTasks();
})();

function toggleTaskProjectField() {
  const at = $("#taskAssignmentType").value;
  const show = (at === "Group Shared" || at === "Group Divided");
  $("#taskProjectField").style.display = show ? "" : "none";
  if (show) populateTaskProjectSelect();
}

function populateTaskProjectSelect() {
  const courseId = parseInt($("#taskCourse").value);
  const filtered = allProjects.filter(p => p.course_id == courseId);
  $("#taskProject").innerHTML = "<option value=''>" + (filtered.length ? "— Select a project —" : "No projects in this course") + "</option>" +
    filtered.map(p => "<option value='" + p.id + "'>" + escapeHtml(p.title) + (p.member_count ? " (" + p.member_count + " members)" : "") + "</option>").join("");
}

async function createTask(e) {
  e.preventDefault();
  const course_id = parseInt($("#taskCourse").value);
  const title = $("#taskTitle").value.trim();
  const desc = $("#taskDesc").value.trim();
  const type = $("#taskType").value;
  const priority = $("#taskPriority").value;
  const deadline = $("#taskDeadline").value;
  const assignment_type = $("#taskAssignmentType").value;
  const project_id = $("#taskProject").value ? parseInt($("#taskProject").value) : null;

  const body = { title, description: desc, type, course_id, priority, deadline, assignment_type };
  if (assignment_type === "Group Shared" || assignment_type === "Group Divided") {
    if (!project_id) { showNotif("Please select a project group", "danger"); return; }
    body.project_id = project_id;
  }
  const r = await apiFetch("/tasks", { method: "POST", body: JSON.stringify(body) });
  if (r) {
    showNotif("Task created!", "success");
    $("#taskTitle").value = ""; $("#taskDesc").value = ""; $("#taskDeadline").value = "";
    loadTasks();
  }
}

async function loadTasks() {
  const [tasks, assignments] = await Promise.all([
    apiFetch("/tasks"),
    apiFetch("/tasks/assign")
  ]);
  if (!tasks) return;
  allTasks = tasks;
  allTasksAssignments = assignments || [];
  // For Group Divided tasks, count sub-tasks (each member gets their own individual sub-task)
  const divTaskIds = new Set(allTasks.filter(t => t.assignment_type === "Group Divided").map(t => t.id));
  allTasks.forEach(t => {
    if (divTaskIds.has(t.id)) {
      t._subTaskCount = allTasksAssignments.filter(a => a.project_id == t.project_id && a.task_id !== t.id).length;
    }
  });
  applyTaskFilters();
}

function applyTaskFilters() {
  const query = ($("#taskSearch").value || "").trim().toLowerCase();
  const priority = $("#taskFilterPriority").value;
  const status = $("#taskFilterStatus").value;
  const course = $("#taskFilterCourse").value;

  let filtered = allTasks;
  if (query) filtered = filtered.filter(t => t.title.toLowerCase().includes(query) || t.type.toLowerCase().includes(query));
  if (priority) filtered = filtered.filter(t => t.priority === priority);
  if (status) filtered = filtered.filter(t => t.status === status);
  if (course) filtered = filtered.filter(t => t.course_id == course);

  const total = filtered.length;
  const totalPages = Math.ceil(total / TASKS_PER_PAGE) || 1;
  const safePage = Math.min(taskPage, totalPages);
  const start = (safePage - 1) * TASKS_PER_PAGE;
  const items = filtered.slice(start, start + TASKS_PER_PAGE);

  renderTasks(items);
  renderTaskPagination(safePage, totalPages);
}

function renderTaskPagination(currentPage, totalPages) {
  const pageEl = $("#taskPagination");
  if (!pageEl) return;
  if (totalPages <= 1) { pageEl.innerHTML = ""; return; }
  pageEl.innerHTML = renderPagination(currentPage, totalPages, "function(p){taskPage=getPagination(p,"+totalPages+"||1,"+TASKS_PER_PAGE+");applyTaskFilters();}");
}

function getAssignTypeClass(at) {
  const m = { "Individual": "badge-active", "Group Shared": "badge-inprogress", "Group Divided": "badge-pending" };
  return m[at] || "badge-pending";
}

function renderTasks(tasks) {
  const tbody = $("#taskTable");
  const countEl = $("#taskResultsCount");
  if (countEl) countEl.textContent = "Showing " + tasks.length + " of " + allTasks.length + " tasks";
  if (tasks.length) {
    tbody.innerHTML = tasks.map(t => {
      const directAssigns = allTasksAssignments ? allTasksAssignments.filter(a => a.task_id == t.id).length : 0;
      const isGroupDivided = (t.assignment_type === "Group Divided");
      const assignCount = isGroupDivided ? (t._subTaskCount || 0) : directAssigns;
      const proj = allProjects.find(p => p.id == t.project_id);
      return "<tr>" +
        "<td><strong>" + escapeHtml(t.title) + "</strong></td>" +
        "<td>" + escapeHtml(t.type) + "</td>" +
        "<td>" + escapeHtml(t.course_code) + "</td>" +
        "<td><span class='badge " + getAssignTypeClass(t.assignment_type) + "'>" + escapeHtml(t.assignment_type || "Individual") + "</span></td>" +
        "<td>" + (proj ? escapeHtml(proj.title) : "<span style='color:var(--muted)'>—</span>") + "</td>" +
        "<td><span class='" + getPriorityClass(t.priority) + "'>" + t.priority + "</span></td>" +
        "<td>" + formatDate(t.deadline) + "</td>" +
        "<td>" + assignCount + " student" + (assignCount !== 1 ? "s" : "") + "</td>" +
        "<td>" +
          "<button class='btn btn-sm btn-primary' data-task-id=\"" + t.id + "\" data-task-title=\"" + escapeHtml(t.title) + "\"><i class='fas fa-user-plus'></i></button> " +
          "<button class='btn btn-sm btn-outline' data-manage-task-id=\"" + t.id + "\"><i class='fas fa-list'></i></button> " +
          "<button class='btn btn-sm btn-danger' data-delete-task-id=\"" + t.id + "\"><i class='fas fa-trash'></i></button>" +
        "</td>" +
      "</tr>";
    }).join("");
  } else {
    tbody.innerHTML = "<tr><td colspan='9'><div class='empty-state'><i class='fas fa-tasks'></i><p>No tasks yet</p></div></td></tr>";
  }
}

async function openAssignModal(taskId, taskTitle) {
  console.log("[openAssignModal] taskId=" + taskId + " taskTitle=" + taskTitle + " type=" + typeof taskId);
  $("#assignTaskId").value = taskId;
  $("#assignTaskTitle").value = taskTitle || "";
  $("#assignWeight").value = "";
  $("#assignDeadline").value = "";

  // Load task details to get its assignment_type and project_id
  const task = allTasks.find(t => t.id == taskId);
  const defaultAssignType = (task && task.assignment_type) || "Individual";
  $("#assignAssignmentType").value = defaultAssignType;

  // Load occupied students — separate project members from task assignments
  const occ = await apiFetch("/occupied-students");
  const occData = occ || {};
  projectMemberIds = new Set(occData.project_members || []);
  taskAssignedIds = new Set(occData.task_assigned || []);

  const students = allStudents.filter(st => st.role === "student");
  renderAssignStudentSelect(students, defaultAssignType);

  toggleAssignFields();
  $("#assignModal").style.display = "flex";
}

function renderAssignStudentSelect(students, assignmentType) {
  // Only Group Shared disables students already in a project; Group Divided gives each student their own sub-task
  const isGroupShared = (assignmentType === "Group Shared");
  $("#assignStudent").innerHTML = students.map(st => {
    const isInProject = projectMemberIds.has(st.id);
    const isInTask = taskAssignedIds.has(st.id);
    const isDisabled = isGroupShared ? isInProject : false;
    const tag = isInProject ? " <small style='color:var(--muted)'>[In Group]</small>" : (isInTask ? " <small style='color:var(--muted)'>[Has Tasks]</small>" : "");
    return "<option value='" + st.id + "' " + (isDisabled ? "disabled title='Already in a project group'" : "") + ">" + escapeHtml(st.name) + " (" + escapeHtml(st.email) + ")" + tag + "</option>";
  }).join("");
}

function toggleAssignFields() {
  const at = $("#assignAssignmentType").value;
  const students = allStudents.filter(st => st.role === "student");
  if (at === "Individual") {
    $("#assignIndividualField").style.display = "";
    $("#assignProjectField").style.display = "none";
    $("#assignGroupInfo").style.display = "none";
    $("#assignStudent").required = true;
    $("#assignWeight").required = false;
    $("#assignDeadline").required = false;
    $("#weightHint").textContent = "Optional for individual tasks";
    renderAssignStudentSelect(students, "Individual");
  } else {
    // Group Shared or Group Divided
    $("#assignIndividualField").style.display = "none";
    $("#assignProjectField").style.display = "";
    $("#assignGroupInfo").style.display = "";
    $("#assignStudent").required = false;
    $("#assignWeight").required = true;
    $("#assignDeadline").required = true;
    const isDivided = (at === "Group Divided");
    $("#weightHint").textContent = isDivided ? "Weight per sub-task (0–100)" : "Enter value between 0–100";
    $("#assignGroupTypeHint").textContent = isDivided ? "→ Will create one individual sub-task per group member" : "";
    renderAssignStudentSelect(students, at);
    populateAssignProjectSelect();
  }
}

function populateAssignProjectSelect() {
  const courseId = allTasks.find(t => t.id == $("#assignTaskId").value)?.course_id;
  const filtered = courseId ? allProjects.filter(p => p.course_id == courseId) : allProjects;
  const currentTask = allTasks.find(t => t.id == $("#assignTaskId").value);
  $("#assignProject").innerHTML = "<option value=''>— Select a project —</option>" +
    filtered.map(p => {
      const sel = currentTask && currentTask.project_id == p.id ? "selected" : "";
      return "<option value='" + p.id + "' " + sel + ">" + escapeHtml(p.title) + " (" + p.member_count + " members)" + "</option>";
    }).join("");
  if (currentTask?.project_id) {
    $("#assignProject").value = currentTask.project_id;
    loadGroupMembers();
  }
}

async function loadGroupMembers() {
  const projectId = parseInt($("#assignProject").value);
  if (!projectId) {
    $("#assignGroupInfo").style.display = "none";
    return;
  }
  const members = await apiFetch("/projects/" + projectId + "/members");
  if (members) {
    const proj = allProjects.find(p => p.id == projectId);
    $("#assignGroupLabel").textContent = "Project: " + (proj ? proj.title : "Group");
    $("#assignGroupMembers").innerHTML = members.map(m => "<div>" + escapeHtml(m.name) + " <small>(" + escapeHtml(m.role || "Member") + ")</small></div>").join("");
    $("#assignGroupInfo").style.display = "";
  }
}

function closeAssignModal() {
  $("#assignModal").style.display = "none";
}

async function assignTask(e) {
  e.preventDefault();
  const task_id = parseInt($("#assignTaskId").value);
  const assignment_type = $("#assignAssignmentType").value;
  const weight_percent = $("#assignWeight").value ? parseInt($("#assignWeight").value) : 0;
  const deadline = $("#assignDeadline").value;

  let project_id = null;
  let student_id = null;

  if (assignment_type === "Individual") {
    student_id = parseInt($("#assignStudent").value);
    if (!student_id) { showNotif("Please select a student", "danger"); return; }
  } else {
    // Group Shared
    project_id = parseInt($("#assignProject").value);
    if (!project_id) { showNotif("Please select a project group", "danger"); return; }
    if (isNaN(weight_percent) || weight_percent < 0 || weight_percent > 100) {
      showNotif("Weight must be between 0–100", "danger");
      $("#assignWeight").focus();
      return;
    }
    if (!deadline) { showNotif("Please select a deadline", "danger"); $("#assignDeadline").focus(); return; }
  }

  const body = { task_id, assignment_type, project_id, weight_percent, deadline };
  if (assignment_type === "Individual") body.student_id = student_id;

  console.log("[assignTask] sending:", body);
  const r = await apiFetch("/tasks/assign", {
    method: "POST",
    body: JSON.stringify(body)
  }).catch(function(err) { console.error("[assignTask] fetch error:", err); });
  console.log("[assignTask] response:", r);
  if (r && r.success) {
    // Track assignment locally since GET /tasks/assign is unreliable in MySQL mode
    if (assignment_type === "Individual" && student_id) {
      const task = allTasks.find(t => t.id == task_id);
      const student = allStudents.find(st => st.id == student_id);
      allTasksAssignments.push({
        id: Date.now(),
        task_id: task_id,
        student_id: student_id,
        student_name: student ? student.name : "Unknown",
        weight_percent: weight_percent,
        deadline: deadline,
        status: "Not Started",
        project_id: project_id || null
      });
    }
    const msg = assignment_type === "Group Shared"
      ? ("Task assigned to " + (r.assigned_count || "?") + " group members!")
      : "Task assigned to student!";
    showNotif(msg, "success");
    closeAssignModal();
    loadTasks();
  } else if (r && r.error) {
    showNotif("Error: " + r.error, "danger");
  } else {
    showNotif("Failed to assign task", "danger");
  }
}

async function openManageModal(taskId) {
  console.log("[openManageModal] taskId=" + taskId);
  const tasks = await apiFetch("/tasks");
  // Try fetching assignments, fall back to local state (GET /tasks/assign is unreliable in MySQL mode)
  const apiAssignments = await apiFetch("/tasks/assign");
  const assignments = (apiAssignments && apiAssignments.length > 0) ? apiAssignments : allTasksAssignments;
  console.log("[openManageModal] assignments=" + JSON.stringify(assignments?.length) + " tasks=" + JSON.stringify(tasks?.length));
  if (!assignments) return;
  console.log("[openManageModal] all assignments:", JSON.stringify(assignments.map(a => ({ id: a.id, task_id: a.task_id, student_id: a.student_id }))));
  const taskAssigns = assignments.filter(a => a.task_id == taskId);
  const task = tasks.find(t => t.id == taskId);

  allTasksAssignments = assignments;

  $("#manageModal").dataset.taskId = taskId;
  $("#manageModal").style.display = "flex";

  const proj = allProjects.find(p => p.id == task?.project_id);
  const typeBadge = "<span class='badge " + getAssignTypeClass(task?.assignment_type) + "'>" + escapeHtml(task?.assignment_type || "Individual") + "</span>";
  const projLabel = proj ? escapeHtml(proj.title) : "—";

  let html = "<p style='margin-bottom:15px'>" +
    "<strong>Task:</strong> " + escapeHtml(task?.title) + " | " +
    "<strong>Type:</strong> " + typeBadge + " | " +
    "<strong>Project:</strong> " + projLabel +
    "</p>";

  if (taskAssigns.length) {
    html += "<table class='table-responsive'><tr><th>Student</th><th>Weight</th><th>Deadline</th><th>Status</th><th>Actions</th></tr>" +
      taskAssigns.map(ta => "<tr>" +
        "<td>" + escapeHtml(ta.student_name) + "</td>" +
        "<td><strong>" + ta.weight_percent + "%</strong></td>" +
        "<td>" + formatDate(ta.deadline) + "</td>" +
        "<td><span class='badge " + getStatusClass(ta.status) + "'>" + ta.status + "</span></td>" +
        "<td>" +
          "<button class='btn btn-sm btn-outline' data-toggle-status-id=\"" + ta.id + "\" data-toggle-status-val=\"" + ta.status + "\"><i class='fas fa-sync'></i></button> " +
          "<button class='btn btn-sm btn-danger' data-delete-assign-id=\"" + ta.id + "\"><i class='fas fa-trash'></i></button>" +
        "</td>" +
      "</tr>").join("") +
      "</table>";
  } else {
    html += "<div class='empty-state'><i class='fas fa-user-plus'></i><p>No assignments yet. Click 'Assign' button to add.</p></div>";
  }
  $("#assignList").innerHTML = html;
}

function closeManageModal() {
  $("#manageModal").style.display = "none";
}

async function toggleStatus(id, currentStatus) {
  const newStatus = currentStatus === "Not Started" ? "In Progress" : currentStatus === "In Progress" ? "Completed" : "Not Started";
  await apiFetch("/tasks/assign/" + id, {
    method: "PUT",
    body: JSON.stringify({ status: newStatus })
  });
  // Update local state
  const assign = allTasksAssignments.find(a => a.id == id);
  if (assign) assign.status = newStatus;
  showNotif("Status updated!", "success");
  const manageModal = document.querySelector("#manageModal");
  const storedTaskId = manageModal?.dataset?.taskId;
  openManageModal(storedTaskId || id);
  loadTasks();
}

async function deleteAssign(id) {
  if (!confirm("Remove this assignment?")) return;
  const r = await apiFetch("/tasks/assign/" + id, { method: "DELETE" });
  if (r) {
    showNotif("Assignment removed!", "success");
    allTasksAssignments = allTasksAssignments.filter(a => a.id != id);
    loadTasks();
  }
}

function openEditModal(taskId) {
  alert("Edit feature coming soon!");
}

function closeEditModal() {}

async function deleteTask(id) {
  if (!confirm("Are you sure you want to delete this task?")) return;
  const r = await apiFetch("/tasks/" + id, { method: "DELETE" });
  if (r) {
    showNotif("Task deleted!", "success");
    loadTasks();
  }
}

async function toggleTaskStatus(id, currentStatus) {
  const newStatus = currentStatus === "Pending" ? "Active" : currentStatus === "Active" ? "Completed" : "Pending";
  const r = await apiFetch("/tasks/status", {
    method: "PUT",
    body: JSON.stringify({ id, status: newStatus })
  });
  if (r) {
    showNotif("Status updated to: " + newStatus, "success");
    loadTasks();
  }
}

</script>

<script>
// Mobile table converter
function makeTablesMobileResponsive(){
  const isMobile=window.innerWidth<=640;
  document.querySelectorAll('table').forEach(table=>{
    const wrapper=table.parentElement;
    if(!wrapper.classList.contains('table-responsive'))return;
    if(isMobile){
      if(!table.classList.contains('mobile-converted')){
        table.querySelectorAll('tr').forEach(tr=>{
          tr.querySelectorAll('td').forEach((td,i)=>{
            const th=table.querySelector('thead th:nth-child('+(i+1)+')');
            const label=th?th.textContent.trim():'Cell '+(i+1);
            td.setAttribute('data-label',label);
          });
        });
        table.classList.add('mobile-converted');
      }
    }else{
      table.querySelectorAll('[data-label]').forEach(td=>td.removeAttribute('data-label'));
      table.classList.remove('mobile-converted');
    }
  });
}
window.addEventListener('load',makeTablesMobileResponsive);
window.addEventListener('resize',()=>{clearTimeout(window._tblTimeout);window._tblTimeout=setTimeout(makeTablesMobileResponsive,150)});
</script>

<script>
(function(){
  function convertTables(){
    var isMobile=window.innerWidth<=640;
    document.querySelectorAll('table').forEach(function(table){
      var wrapper=table.parentElement;
      if(!wrapper||!wrapper.classList.contains('table-responsive'))return;
      table.querySelectorAll('tr').forEach(function(tr){
        tr.querySelectorAll('td').forEach(function(td,i){
          var th=table.querySelector('thead th:nth-child('+(i+1)+')');
          var label=th?th.textContent.trim():'Cell '+(i+1);
          if(isMobile){td.setAttribute('data-label',label)}
          else{td.removeAttribute('data-label')}
        });
      });
    });
  }
  convertTables();
  window.addEventListener('resize',function(){clearTimeout(window._rt);window._rt=setTimeout(convertTables,200)});
})();
document.addEventListener("click", function(e) {
  if (e.target.id === "assignModal") { closeAssignModal(); return; }
  if (e.target.id === "manageModal") { closeManageModal(); return; }
  const btn = e.target.closest("[data-task-id]");
  if (btn) { console.log("[click] assign:", btn.dataset.taskId); openAssignModal(btn.dataset.taskId, btn.dataset.taskTitle); return; }
  const mbtn = e.target.closest("[data-manage-task-id]");
  if (mbtn) { openManageModal(mbtn.dataset.manageTaskId); return; }
  const dbtn = e.target.closest("[data-delete-task-id]");
  if (dbtn) { deleteTask(dbtn.dataset.deleteTaskId); return; }
  const tsbtn = e.target.closest("[data-toggle-status-id]");
  if (tsbtn) { toggleStatus(tsbtn.dataset.toggleStatusId, tsbtn.dataset.toggleStatusVal); return; }
  const dabtn = e.target.closest("[data-delete-assign-id]");
  if (dabtn) { deleteAssign(dabtn.dataset.deleteAssignId); return; }
});
</script>
