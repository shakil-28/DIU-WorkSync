<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DIU WorkSync - Login</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
<div class="auth-box">
<div class="logo">
<h1><i class="fas fa-sync-alt"></i> DIU WorkSync</h1>
<p>University Academic Task & Group Contribution Management</p>
</div>
<div id="alertBox"></div>
<div id="loginForm">
<form onsubmit="handleLogin(event)">
<div class="form-group"><label><i class="fas fa-envelope"></i> Email</label><input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required></div>
<div class="form-group"><label><i class="fas fa-lock"></i> Password</label><input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required></div>
<button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Login</button>
</form>
<p class="auth-footer">No account? <a href="#" onclick="showRegister()">Register</a></p>
<p class="auth-footer" style="font-size:.75rem;color:var(--muted)">Demo: teacher@diu.edu.bd / password</p>
</div>
<div id="registerForm" style="display:none">
<form onsubmit="handleRegister(event)">
<div class="form-group"><label>Name</label><input type="text" class="form-control" id="regName" required></div>
<div class="form-group"><label>Email</label><input type="email" class="form-control" id="regEmail" required></div>
<div class="form-group"><label>Password</label><input type="password" class="form-control" id="regPassword" minlength="6" required></div>
<div class="form-group"><label>I am a</label><select class="form-control" id="regRole"><option value="student">Student</option><option value="teacher">Teacher</option></select></div>
<button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Register</button>
</form>
<p class="auth-footer">Has account? <a href="#" onclick="showLogin()">Login</a></p>
</div>
</div>
<script src="/js/app.js"></script>
<script>
function showRegister(){ $("#loginForm").style.display="none"; $("#registerForm").style.display="block"; $("#alertBox").innerHTML=""; }
function showLogin(){ $("#registerForm").style.display="none"; $("#loginForm").style.display="block"; $("#alertBox").innerHTML=""; }
function showAlert(msg, t){ $("#alertBox").innerHTML="<div class='alert alert-"+t+"'>"+msg+"</div>"; }
async function handleLogin(e){
  e.preventDefault();
  const email = $("#loginEmail").value.trim();
  const password = $("#loginPassword").value;
  const r = await Session.login(email, password);
  if (r.success) {
    const user = r.user;
    window.location.href = user.role === "teacher" ? "/pages/teacher/dashboard.html" : "/pages/student/dashboard.html";
  } else {
    showAlert(r.error, "danger");
  }
}
async function handleRegister(e){
  e.preventDefault();
  const name = $("#regName").value.trim();
  const email = $("#regEmail").value.trim();
  const password = $("#regPassword").value;
  const role = $("#regRole").value;
  const r = await Session.register(name, email, password, role);
  if (r.success) {
    showAlert("Registered! Login now", "success");
    setTimeout(showLogin, 1200);
  } else {
    showAlert(r.error, "danger");
  }
}
if (Session.isAuthenticated()) {
  const s = Session.get();
  window.location.href = s.role === "teacher" ? "/pages/teacher/dashboard.html" : "/pages/student/dashboard.html";
}
</script>
</body>
</html>
